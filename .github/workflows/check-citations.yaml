
name: check-citations

on:
  schedule:
    - cron: '0 7 1 * *'      # 07:00 UTC, 1st of the month
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/**'
      - 'R/**'
      - 'docs/**'
      - 'README.md'
      - 'DESCRIPTION'
      - 'inst/CITATION'

permissions:
  contents: read
  issues: write

jobs:
  citations:
    uses: chross22/distsamp/.github/workflows/citation-check-reusable.yaml@main
